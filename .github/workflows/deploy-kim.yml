
name: React CI/CD - Kim

on:
  push:
    branches:
      - feat/cicd-kim

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: cicd-kim

    steps:
      # GitHub 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # Node.js 설정
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 패키지 설치
      - name: Install dependencies
        run: npm ci

      # React 빌드
      - name: Build
        run: npm run build

      # AWS 인증
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      # S3 자동 배포
      - name: Deploy to S3
        run: aws s3 sync dist/ s3://redbeanz-web-front/ --delete
